<html>
	<title> Lab 10 </title>
	<body>
		
		<h2 style="text-align: center; color:red;"> Continental Hotel Reservation Form </h2>
		<table border="1" style="margin: 0 auto; border: 1px solid black; border-collapse: collapse; background-color: lightblue;">
				<tr>
		<th>
		<form action="/submit-form-endlpoint" method="POST">
		<div style="text-align: center;><!-- Username --!>
		<label for="userName">Full Name: </label> </th> <th> 
		<input type="text" id="userName" name="username" placeholder="Enter your name" required>
		</div><th> </tr>

		<tr>
		<th>
		<!-- E-mail --!> <br>
		<div style="text-align: center;> <label for="email">eMail: </label> </th> <th>
		<input type="email" id="email" name="Email" placeholder="info@continental.pk">
		</div> <th> </tr>

		<tr>
		<th>
		<!--Mobile Number--!> <br>
		<div style="text-align: center;><label for="Phone"> Mobile No.: </label> </th> <th>
		<input type="contact" id="phone_num" name="Phone" placeholder="Enter your cell number">	
		</div> <th> </tr>

		<tr>
		<th>
		<!-- Arrival Time --!> <br>
		<div style="text-align: center;><label for="Arrival Time"> Arrival Time: </label> </th> <th>
		<input type="time" id="time_arrive" name="Arrival" placeholder="Enter your Arrival Time">
		</div> <th> </tr>

		<tr>
		<th>
		<!-- Departure --!><br>
		<div style="text-align: center;> <label for="Departure Time"> Departure Time: </label> </th> <th>
		<input type="time" id="time_departure" name="Departure" placeholder="Enter your Departure Time">
		</div> <th> </tr>

		<tr>
		<th>
		<!-- Room Type --!> <br>
		<div style="text-align: center;> <label for="Room"> Room Type: </label> </th> <th>
		<input type="radio" id="Room" name="Room" value="room">
			<label for="Room">Single</label>
		<input type="radio" id="Room" name="Room" value="room">
			<label for="Room">Double</label>
		<input type="radio" id="Room" name="Room" value="room">
			<label for="Room">Presidential Suite </label>
		</div> <th> </tr>
	</table>
		<br>
		<div style="text-align: center;">
		<button type="submit"> Submit Form </button>
		</div>
		</form>
	</body>
</html>
